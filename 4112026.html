<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        h1 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        
        h2 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 18px;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #0284c7, #0369a1);
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .btn:hover {
            background: linear-gradient(90deg, #0369a1, #075985);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }

        .btn-surprise {
            display: inline-block;
            background: linear-gradient(90deg, #10b981, #059669);
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            margin-top: 12px;
        }

        .btn-surprise:hover {
            background: linear-gradient(90deg, #059669, #047857);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        .surprise {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
            color: #38bdf8;
            font-weight: 600;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🎂</div>
        <h1>Selamat Ulang Tahun!</h1>
        <h2>RESTU AYU SETYAWATI</h2>
        <p>Semoga panjang umur, sehat selalu, dan semua impian serta targetmu di tahun ini bisa tercapai satu per satu.</p>
        
        <button class="btn" onclick="showSurprise()">Buka Pesan Khusus</button>
        
        <div class="surprise" id="surpriseMessage">
            🪐
            <p style="margin-top: 12px; font-size: 0.95rem; color: #e2e8f0;">Semoga kamu suka:</p>
            <a href="https://drive.google.com/file/d/1KOlgsWtVuh2TlFJIV_qyYh2k7GvwyncJ/preview" target="_blank" class="btn-surprise">Buka Kejutan 🎁</a>
        </div>
    </div>

    <script>
        function showSurprise() {
            const msg = document.getElementById('surpriseMessage');
            if (msg.style.display === 'block') {
                msg.style.display = 'none';
            } else {
                msg.style.display = 'block';
            }
        }
    </script>

</body>
</html>
